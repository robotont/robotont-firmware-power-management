[env:attiny88]
platform = atmelavr
board = attiny88
framework = arduino

; Clock configuration - 1 MHz internal
board_build.f_cpu = 1000000L

; Fuse settings for ATtiny88 (1MHz internal oscillator)
board_fuses.lfuse = 0x62  ; Internal 8MHz/8 = 1MHz, slowly rising power
board_fuses.hfuse = 0xDF  ; SPIEN enabled, EESAVE, 512B bootloader
board_fuses.efuse = 0xFF  ; Self-programming disabled

; Upload configuration
upload_port = /dev/ttyUSB0
upload_speed = 19200
upload_protocol = stk500v1
upload_flags =
    -p
    $BOARD_MCU
    -c
    stk500v1
    -P
    $UPLOAD_PORT
    -b
    $UPLOAD_SPEED
    -D

; Optimized build flags
build_flags = 
    -DARDUINO_AVR_ATTINY88
    -DARDUINO_ARCH_AVR
    -Wall                      ; All warnings
    -Wextra                    ; Extra warnings
    -flto                      ; Link-time optimization
    -fno-fat-lto-objects       ; Smaller LTO objects
    -Os                        ; Optimize for size
    -ffunction-sections        ; Each function in separate section
    -fdata-sections            ; Each data item in separate section
    -fno-exceptions            ; Disable C++ exceptions
    -fno-threadsafe-statics    ; Disable thread-safe static initialization
    -Wl,--gc-sections          ; Garbage collect unused sections
    -Wl,--relax                ; Linker optimizations
    -mcall-prologues           ; Use function calls for prologues (saves flash)

; Serial monitor configuration
monitor_port = /dev/ttyUSB0
monitor_speed = 9600

lib_deps =