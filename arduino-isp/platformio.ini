; Separate project: turns an Arduino board into an ISP programmer, used once to
; flash the ATtiny88 firmware in the parent folder.
;
; Open THIS folder in VS Code, pick your board in the env selector (status bar)
; and press Upload. From the terminal: pio run -e <env> -t upload
;
;   nano      Nano, current bootloader (115200)   [default]
;   nano_old  Nano, pre-2018 bootloader (57600)
;   uno       Uno R3
;
; src/main.cpp is the stock Arduino ArduinoISP example.

[platformio]
default_envs = nano

[env]
platform = atmelavr
framework = arduino
upload_port = /dev/ttyUSB0

[env:nano]
board = nanoatmega328new

[env:nano_old]
board = nanoatmega328

[env:uno]
board = uno
